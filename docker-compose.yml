# ============================================================================
# Enterprise AI Agent — 本地开发依赖一键启动
#   docker compose up -d
# MySQL(库表由应用 resources/db/schema.sql 初始化) / Redis(会话记忆) / ES(向量库)
# ============================================================================
services:

  mysql:
    image: mysql:8.4
    container_name: enterprise-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: enterprise_agent
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: enterprise-agent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  elasticsearch:
    # Spring AI 2.0 的 rest5 客户端（elasticsearch-java 9.x）要求 ES 9.x 服务端
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: enterprise-agent-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  es-data:
